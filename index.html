<!-- index.html — Главная страница -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой сайт о животных</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f4f8;
      color: #2d3748;
      line-height: 1.6;
    }

    header {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      padding: 60px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    header p {
      font-size: 1.1rem;
      opacity: 0.9;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .cards {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 30px;
      flex: 1 1 300px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      transition: transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
      color: inherit;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    }

    .card .emoji {
      font-size: 4rem;
      display: block;
      margin-bottom: 15px;
    }

    .card h2 {
      font-size: 1.5rem;
      margin-bottom: 10px;
      color: #4a5568;
    }

    .card p {
      color: #718096;
      font-size: 0.95rem;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #a0aec0;
      font-size: 0.9rem;
    }

    /* Стили для страниц с описанием */
    .page-header {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      padding: 40px 20px;
      text-align: center;
    }

    .page-header h1 {
      font-size: 2rem;
    }

    .back-link {
      display: inline-block;
      margin-top: 10px;
      color: white;
      text-decoration: none;
      opacity: 0.9;
      font-size: 0.95rem;
    }

    .back-link:hover {
      opacity: 1;
      text-decoration: underline;
    }

    .content {
      background: white;
      border-radius: 12px;
      padding: 35px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      margin-top: 30px;
    }

    .content h2 {
      color: #4a5568;
      margin-bottom: 15px;
      font-size: 1.4rem;
      border-bottom: 3px solid #667eea;
      padding-bottom: 8px;
      display: inline-block;
    }

    .content h3 {
      color: #667eea;
      margin: 20px 0 10px;
      font-size: 1.1rem;
    }

    .content p {
      margin-bottom: 15px;
      color: #4a5568;
      text-align: justify;
    }

    .content ul {
      margin: 10px 0 20px 25px;
      color: #4a5568;
    }

    .content li {
      margin-bottom: 8px;
    }

    .big-emoji {
      font-size: 5rem;
      text-align: center;
      display: block;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🐾 Домашние любимцы</h1>
    <p>Небольшой сайт о наших четвероногих друзьях</p>
  </header>

  <div class="container">
    <div class="cards">
      <a href="cats.html" class="card">
        <span class="emoji">🐱</span>
        <h2>Про котов</h2>
        <p>Узнайте больше о загадочных и грациозных кошках</p>
      </a>

      <a href="dogs.html" class="card">
        <span class="emoji">🐶</span>
        <h2>Про собак</h2>
        <p>Познакомьтесь с верными и преданными собаками</p>
      </a>
    </div>
  </div>

  <footer>
    © 2026 Мой сайт о животных
  </footer>

</body>
</html>
